name: BPT2 Public Discovery HTTP Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'public-web/**'
      - 'modules/catalog/**'
      - 'modules/sellers/**'
      - 'modules/marketplace/**'
      - 'main/**'
      - 'tests/BomPraTi.HttpLifecycleFixture/**'
      - 'scripts/public-discovery-http-smoke.sh'
      - 'scripts/public-canonical-vehicle-search-http-smoke.sh'
      - 'scripts/public-price-sort-http-smoke.sh'
      - 'scripts/public-recency-sort-http-smoke.sh'
      - 'scripts/public-color-filter-http-smoke.sh'
      - 'scripts/buyer-saved-search-color-http-smoke.sh'
      - 'scripts/sponsored-listing-http-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/public-discovery-http-gate.yml'

permissions:
  contents: read

jobs:
  public-discovery-http:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Syntax check Public Discovery smokes
        run: |
          bash -n scripts/public-discovery-http-smoke.sh
          bash -n scripts/public-canonical-vehicle-search-http-smoke.sh
          bash -n scripts/public-price-sort-http-smoke.sh
          bash -n scripts/public-recency-sort-http-smoke.sh
          bash -n scripts/public-color-filter-http-smoke.sh
          bash -n scripts/buyer-saved-search-color-http-smoke.sh
          bash -n scripts/sponsored-listing-http-smoke.sh
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Seed canonical Vehicle fixture
        shell: bash
        run: |
          set -euo pipefail
          vehicle_id="$(dotnet run --project tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release | tail -n 1)"
          test -n "$vehicle_id"
          echo "BPT_FIXTURE_VEHICLE_ID=$vehicle_id" >> "$GITHUB_ENV"
      - name: Exercise canonical Vehicle search over HTTP
        run: bash scripts/public-canonical-vehicle-search-http-smoke.sh
      - name: Exercise public discovery over HTTP
        run: bash scripts/public-discovery-http-smoke.sh
      - name: Exercise public price sort over HTTP
        run: bash scripts/public-price-sort-http-smoke.sh
      - name: Exercise public color filter over HTTP
        run: bash scripts/public-color-filter-http-smoke.sh
      - name: Exercise Saved Search color semantics over HTTP
        run: bash scripts/buyer-saved-search-color-http-smoke.sh
      - name: Exercise sponsored Listing contract over HTTP
        run: bash scripts/sponsored-listing-http-smoke.sh
      - name: Exercise public recency sort over HTTP
        run: bash scripts/public-recency-sort-http-smoke.sh

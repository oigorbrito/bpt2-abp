name: BPT2 Controlled Topology Change Rehearsal

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'scripts/rehearse-controlled-topology-change.py'
      - 'docs/exec-plans/**/0069-controlled-topology-change-rehearsal.md'
      - '.github/workflows/controlled-topology-change-rehearsal.yml'
      - 'docs/generated/repository-facts.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-topology-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Syntax check experiment
        run: python3 -m py_compile scripts/rehearse-controlled-topology-change.py

      - name: Execute three paired topology rehearsals
        run: |
          mkdir -p artifacts
          python3 scripts/rehearse-controlled-topology-change.py \
            --pairs 3 \
            --output artifacts/controlled-topology-change-rehearsal.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlled-topology-change-rehearsal
          path: artifacts/controlled-topology-change-rehearsal.json
          if-no-files-found: error

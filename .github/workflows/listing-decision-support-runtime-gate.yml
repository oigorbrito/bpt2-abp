name: BPT2 Listing Decision Support Runtime Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'public-web/**'
      - 'modules/catalog/**'
      - 'modules/sellers/**'
      - 'modules/marketplace/**'
      - 'main/**'
      - 'tests/BomPraTi.HttpLifecycleFixture/**'
      - 'scripts/listing-http-lifecycle-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/listing-decision-support-runtime-gate.yml'

permissions:
  contents: read

jobs:
  listing-decision-support-runtime:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      BPT_API_BASE_URL: http://127.0.0.1:5091
      BPT_PUBLIC_BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh

      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database

      - name: Seed canonical Vehicle fixture
        shell: bash
        run: |
          set -euo pipefail
          vehicle_id="$(dotnet run --project tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release | tail -n 1)"
          test -n "$vehicle_id"
          echo "BPT_FIXTURE_VEHICLE_ID=$vehicle_id" >> "$GITHUB_ENV"

      - name: Build public web
        working-directory: public-web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Exercise Listing decision support through API, PostgreSQL and rendered public web
        shell: bash
        run: |
          set -euo pipefail
          probe="scripts/.listing-decision-support-smoke.sh"
          cp scripts/listing-http-lifecycle-smoke.sh "$probe"
          trap 'rm -f "$probe"' EXIT
          python3 - "$probe" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = 'echo "HTTP_PUBLIC_SELLER_CONTACT: PASS"\n'
          if marker not in text:
              raise SystemExit("listing lifecycle insertion marker not found")

          injected = r'''
          echo "HTTP_PUBLIC_SELLER_CONTACT: PASS"

          PUBLIC_WEB_LOG="${TMPDIR:-/tmp}/bpt2-public-web.log"
          (
            cd "$ROOT/public-web"
            BPT_API_BASE_URL="$BASE" \
            BPT_PUBLIC_BASE_URL="$BPT_PUBLIC_BASE_URL" \
            npm run start -- --hostname 127.0.0.1 --port 3000 >"$PUBLIC_WEB_LOG" 2>&1
          ) &
          PUBLIC_WEB_PID=$!
          trap 'kill "$PUBLIC_WEB_PID" >/dev/null 2>&1 || true; kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          DETAIL_URL="$BPT_PUBLIC_BASE_URL/anuncios/$LISTING_ID?returnTo=%2F%3Fq%3Dcorolla"
          DETAIL_HTML="${TMPDIR:-/tmp}/bpt2-listing-detail.html"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "$DETAIL_URL" -o "$DETAIL_HTML"; then
              break
            fi
            if ! kill -0 "$PUBLIC_WEB_PID" >/dev/null 2>&1; then
              cat "$PUBLIC_WEB_LOG" >&2
              exit 1
            fi
            sleep 1
          done
          [[ -s "$DETAIL_HTML" ]] || { cat "$PUBLIC_WEB_LOG" >&2; echo "Public Listing detail did not become available." >&2; exit 1; }

          python3 - "$DETAIL_HTML" "$LISTING_ID" "$BPT_FIXTURE_VEHICLE_ID" <<'PYDETAIL'
          from html import unescape
          from pathlib import Path
          import sys

          path, listing_id, vehicle_id = sys.argv[1:]
          html = unescape(Path(path).read_text(encoding="utf-8"))
          required = [
              "HTTP Lifecycle Listing",
              "Veículo canônico",
              "Identidade automotiva e ficha canônica",
              "Ver Vehicle Hub",
              f"/veiculos/{vehicle_id}",
              '/?q=corolla',
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit(f"Listing detail missing expected decision-support evidence: {missing}")
          if f"/anuncios/{listing_id}" not in html:
              raise SystemExit("Listing canonical/detail identity is absent from rendered HTML")
          PYDETAIL

          UNSAFE_HTML="${TMPDIR:-/tmp}/bpt2-listing-detail-unsafe-return.html"
          curl --fail --silent --show-error \
            "$BPT_PUBLIC_BASE_URL/anuncios/$LISTING_ID?returnTo=https%3A%2F%2Fexample.invalid%2Fevil" \
            -o "$UNSAFE_HTML"
          python3 - "$UNSAFE_HTML" <<'PYRETURN'
          from html import unescape
          from pathlib import Path
          import sys

          html = unescape(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if 'href="https://example.invalid/evil"' in html:
              raise SystemExit("unsafe external return navigation was rendered")
          if 'href="/"' not in html:
              raise SystemExit("safe root fallback for external return navigation was not rendered")
          PYRETURN

          echo "HTTP_PUBLIC_LISTING_DECISION_SUPPORT: PASS"
          '''
          path.write_text(text.replace(marker, injected, 1), encoding="utf-8")
          PY
          chmod +x "$probe"
          bash "$probe"

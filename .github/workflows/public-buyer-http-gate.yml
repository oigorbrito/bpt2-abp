name: BPT2 Public Buyer HTTP Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'public-web/**'
      - 'modules/catalog/**'
      - 'modules/sellers/**'
      - 'modules/marketplace/**'
      - 'modules/media/**'
      - 'main/**'
      - 'tests/BomPraTi.HttpLifecycleFixture/**'
      - 'tests/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture/**'
      - 'scripts/public-buyer-http-smoke.sh'
      - 'scripts/buyer-saved-search-http-smoke.sh'
      - 'scripts/public-seller-hub-http-smoke.sh'
      - 'scripts/public-hub-social-images-http-smoke.sh'
      - 'scripts/public-seo-http-smoke.sh'
      - 'scripts/public-listing-structured-data-http-smoke.sh'
      - 'scripts/public-vehicle-hub-http-smoke.sh'
      - 'scripts/whatsapp-auth-forwarding-smoke.sh'
      - 'scripts/authenticated-lead-http-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/saved-search-postgres-claim-benchmark.yml'
      - '.github/workflows/public-buyer-http-gate.yml'

permissions:
  contents: read

jobs:
  public-buyer-http:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Syntax check public HTTP smokes
        run: |
          bash -n scripts/public-buyer-http-smoke.sh
          bash -n scripts/buyer-saved-search-http-smoke.sh
          bash -n scripts/public-seller-hub-http-smoke.sh
          bash -n scripts/public-hub-social-images-http-smoke.sh
          bash -n scripts/public-seo-http-smoke.sh
          bash -n scripts/public-listing-structured-data-http-smoke.sh
          bash -n scripts/public-vehicle-hub-http-smoke.sh
          bash -n scripts/whatsapp-auth-forwarding-smoke.sh
          bash -n scripts/authenticated-lead-http-smoke.sh
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Seed canonical Vehicle fixture
        shell: bash
        run: |
          set -euo pipefail
          vehicle_id="$(dotnet run --project tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release | tail -n 1)"
          test -n "$vehicle_id"
          echo "BPT_FIXTURE_VEHICLE_ID=$vehicle_id" >> "$GITHUB_ENV"
      - name: Exercise public Buyer flow over HTTP
        run: bash scripts/public-buyer-http-smoke.sh
      - name: Exercise public Seller Hub over HTTP
        run: bash scripts/public-seller-hub-http-smoke.sh
      - name: Exercise public Vehicle Hub over HTTP
        run: bash scripts/public-vehicle-hub-http-smoke.sh
      - name: Exercise public hub social images over HTTP
        run: bash scripts/public-hub-social-images-http-smoke.sh
      - name: Exercise public SEO over HTTP
        run: bash scripts/public-seo-http-smoke.sh
      - name: Exercise public Listing structured data over HTTP
        run: bash scripts/public-listing-structured-data-http-smoke.sh
      - name: Prove authenticated Lead UserId over HTTP
        run: bash scripts/authenticated-lead-http-smoke.sh
      - name: Prove authenticated Lead forwarding through public web
        run: bash scripts/whatsapp-auth-forwarding-smoke.sh
      - name: Exercise Saved Search monitoring over HTTP
        run: bash scripts/buyer-saved-search-http-smoke.sh

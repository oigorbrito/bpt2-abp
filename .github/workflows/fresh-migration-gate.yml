name: BPT2 Fresh Migration Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'scripts/bootstrap-host.sh'
      - 'scripts/wire-host.py'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/fresh-migration-gate.yml'

permissions:
  contents: read

jobs:
  fresh-migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: BomPraTi
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Generate and wire ABP host
        run: bash scripts/bootstrap-host.sh
      - name: Generate module migrations and apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Verify module tables exist
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('"CatalogBrands"') IS NULL THEN RAISE EXCEPTION 'CatalogBrands missing'; END IF;
            IF to_regclass('"MediaAssets"') IS NULL THEN RAISE EXCEPTION 'MediaAssets missing'; END IF;
            IF to_regclass('"SellerProfiles"') IS NULL THEN RAISE EXCEPTION 'SellerProfiles missing'; END IF;
            IF to_regclass('"MarketplaceListings"') IS NULL THEN RAISE EXCEPTION 'MarketplaceListings missing'; END IF;
            IF to_regclass('"IngestionRecords"') IS NULL THEN RAISE EXCEPTION 'IngestionRecords missing'; END IF;
          END $$;
          SQL

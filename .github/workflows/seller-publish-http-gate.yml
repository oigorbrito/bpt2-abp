name: BPT2 Seller Photos Publish HTTP Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'public-web/**'
      - 'modules/catalog/**'
      - 'modules/sellers/**'
      - 'modules/media/**'
      - 'modules/marketplace/**'
      - 'main/**'
      - 'tests/BomPraTi.HttpLifecycleFixture/**'
      - 'scripts/seller-publish-http-smoke.sh'
      - 'scripts/seller-leads-http-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/seller-publish-http-gate.yml'

permissions:
  contents: read

jobs:
  seller-photos-publish-http:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      BPT_SELLER_WEB_ROOT: http://127.0.0.1:3097
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Syntax check Seller HTTP smokes
        run: |
          bash -n scripts/seller-publish-http-smoke.sh
          bash -n scripts/seller-leads-http-smoke.sh
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          export OpenIddict__Applications__BomPraTi_SellerWeb__RootUrl="$BPT_SELLER_WEB_ROOT"
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Seed canonical Vehicle fixture
        shell: bash
        run: |
          set -euo pipefail
          vehicle_id="$(dotnet run --project tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release | tail -n 1)"
          test -n "$vehicle_id"
          echo "BPT_FIXTURE_VEHICLE_ID=$vehicle_id" >> "$GITHUB_ENV"
      - name: Exercise Seller photos, publication and public web
        run: bash scripts/seller-publish-http-smoke.sh
      - name: Exercise Seller Lead inbox ownership
        run: bash scripts/seller-leads-http-smoke.sh

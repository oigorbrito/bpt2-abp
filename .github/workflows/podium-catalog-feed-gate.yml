name: BPT2 Podium Catalog Feed Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'main/BomPraTi/Controllers/PodiumCatalogFeedController.cs'
      - 'modules/catalog/**'
      - 'modules/ingestion/**'
      - 'tests/BomPraTi.PodiumCatalogFeedFixture/**'
      - 'scripts/fresh-migration-gate.sh'
      - 'scripts/podium-catalog-feed-http-smoke.sh'
      - 'docs/exec-plans/active/0072-podium-catalog-feed-http-v1.md'
      - 'docs/agent/CURRENT-WORK.md'
      - '.github/workflows/podium-catalog-feed-gate.yml'

permissions:
  contents: read

jobs:
  podium-catalog-feed:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Syntax check Podium HTTP smoke
        run: bash -n scripts/podium-catalog-feed-http-smoke.sh
      - name: Build focused Podium fixture
        run: dotnet build tests/BomPraTi.PodiumCatalogFeedFixture/BomPraTi.PodiumCatalogFeedFixture.csproj --configuration Release
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Exercise Podium catalog feed
        run: dotnet run --project tests/BomPraTi.PodiumCatalogFeedFixture/BomPraTi.PodiumCatalogFeedFixture.csproj --configuration Release --no-build
      - name: Exercise Podium catalog feed over HTTP
        run: bash scripts/podium-catalog-feed-http-smoke.sh

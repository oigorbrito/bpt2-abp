name: Validate dotnet-ef 10.0.12
on:
  push:
    branches:
      - chore/dotnet-ef-10.0.12
    paths:
      - .github/workflows/validate-dotnet-ef-cli.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: BomPraTi
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Restore and verify dotnet-ef
        run: |
          dotnet tool restore
          test "$(dotnet ef --version | awk '{print $NF}')" = "10.0.12"
      - name: Build lifecycle fixture
        run: dotnet build tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release
      - name: Generate and wire ABP host
        run: bash scripts/bootstrap-host.sh
      - name: Generate module migrations and apply fresh database
        run: bash scripts/fresh-migration-gate.sh

name: BPT2 Multi-Repo Contract Boundary Prototype

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'main/**'
      - 'modules/**'
      - 'tests/**'
      - 'public-web/**'
      - 'scripts/prototype-multi-repo-boundary.py'
      - 'docs/exec-plans/active/0064-multi-repo-contract-boundary-prototype.md'
      - 'docs/exec-plans/completed/0064-multi-repo-contract-boundary-prototype.md'
      - 'docs/audits/2026-09-03-multi-repo-contract-boundary-prototype.md'
      - '.github/workflows/multi-repo-contract-boundary-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BPT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      BPT_API_BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Generate contract boundary evidence
        run: |
          mkdir -p artifacts
          python3 scripts/prototype-multi-repo-boundary.py --output artifacts/multi-repo-contract-boundary-prototype.json

      - name: Materialize backend-only repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          backend_dir="${RUNNER_TEMP}/bpt2-backend-prototype"
          rm -rf "$backend_dir"
          mkdir -p "$backend_dir"
          rsync -a --exclude='.git/' --exclude='public-web/' ./ "$backend_dir/"
          test ! -e "$backend_dir/public-web"
          printf '%s\n' "$backend_dir" > "${RUNNER_TEMP}/backend-dir.txt"

      - name: Build backend snapshot independently
        shell: bash
        run: |
          set -euo pipefail
          backend_dir="$(cat "${RUNNER_TEMP}/backend-dir.txt")"
          cd "$backend_dir"
          dotnet build main/BomPraTi/BomPraTi.csproj --configuration Release --nologo

      - name: Materialize frontend-only repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          frontend_dir="${RUNNER_TEMP}/bpt2-frontend-prototype"
          rm -rf "$frontend_dir"
          mkdir -p "$frontend_dir"
          rsync -a public-web/ "$frontend_dir/"
          test -f "$frontend_dir/package.json"
          test -f "$frontend_dir/package-lock.json"
          if find "$frontend_dir" -path '*/docs/*' -o -path '*/scripts/*' -o -path '*/.github/*' | grep -q .; then
            echo "frontend snapshot unexpectedly contains shared/control-plane paths" >&2
            exit 1
          fi
          printf '%s\n' "$frontend_dir" > "${RUNNER_TEMP}/frontend-dir.txt"

      - name: Install and check frontend snapshot independently
        shell: bash
        run: |
          set -euo pipefail
          frontend_dir="$(cat "${RUNNER_TEMP}/frontend-dir.txt")"
          cd "$frontend_dir"
          npm ci --no-audit --no-fund
          npm run check

      - name: Record build results
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/multi-repo-contract-boundary-prototype.json')
          data = json.loads(p.read_text())
          data['execution'] = {
              'backend_build_pass': True,
              'frontend_install_pass': True,
              'frontend_check_pass': True,
          }
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload prototype evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-repo-contract-boundary-prototype
          path: artifacts/multi-repo-contract-boundary-prototype.json
          if-no-files-found: error

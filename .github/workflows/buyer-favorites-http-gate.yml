name: BPT2 Buyer Favorites HTTP Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'modules/marketplace/**'
      - 'main/BomPraTi/Data/**'
      - 'main/BomPraTi/Pages/**'
      - 'main/BomPraTi/appsettings.json'
      - 'public-web/**'
      - 'scripts/buyer-favorites-http-smoke.sh'
      - 'scripts/favorite-price-drop-http-smoke.sh'
      - 'scripts/buyer-saved-search-http-smoke.sh'
      - 'scripts/buyer-listing-report-http-smoke.sh'
      - 'scripts/moderation-report-inbox-http-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - 'tests/BomPraTi.HttpLifecycleFixture/**'
      - 'tests/BomPraTi.PriceDropFixture/**'
      - '.github/workflows/buyer-favorites-http-gate.yml'

jobs:
  buyer-favorites-http:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Syntax check Buyer HTTP smokes
        run: |
          bash -n scripts/buyer-favorites-http-smoke.sh
          bash -n scripts/favorite-price-drop-http-smoke.sh
          bash -n scripts/buyer-saved-search-http-smoke.sh
          bash -n scripts/buyer-listing-report-http-smoke.sh
          bash -n scripts/moderation-report-inbox-http-smoke.sh
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          export OpenIddict__Applications__BomPraTi_BuyerWeb__RootUrl=http://127.0.0.1:3100
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Seed canonical Vehicle fixture
        shell: bash
        run: |
          set -euo pipefail
          vehicle_id="$(dotnet run --project tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release | tail -n 1)"
          test -n "$vehicle_id"
          echo "BPT_FIXTURE_VEHICLE_ID=$vehicle_id" >> "$GITHUB_ENV"
      - name: Exercise Buyer Favorites over HTTP
        run: bash scripts/buyer-favorites-http-smoke.sh
      - name: Exercise Favorite price-drop detection over HTTP
        run: bash scripts/favorite-price-drop-http-smoke.sh
      - name: Exercise Buyer Saved Searches over HTTP
        run: bash scripts/buyer-saved-search-http-smoke.sh
      - name: Exercise Buyer Listing Reports over HTTP
        run: bash scripts/buyer-listing-report-http-smoke.sh
      - name: Exercise Moderation Report Inbox and Admin Surface over HTTP
        run: bash scripts/moderation-report-inbox-http-smoke.sh

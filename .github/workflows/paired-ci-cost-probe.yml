name: BPT2 Paired CI Cost Probe

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'main/**'
      - 'modules/**'
      - 'tests/**'
      - 'public-web/**'
      - 'scripts/measure-paired-ci-cost.py'
      - 'docs/exec-plans/active/0066-paired-ci-cost-probe.md'
      - 'docs/exec-plans/completed/0066-paired-ci-cost-probe.md'
      - 'docs/audits/2026-09-03-paired-ci-cost-probe.md'
      - '.github/workflows/paired-ci-cost-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-ci-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - name: Execute five paired observations
        run: |
          mkdir -p artifacts
          python3 scripts/measure-paired-ci-cost.py --pairs 5 --output artifacts/paired-ci-cost-probe.json

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paired-ci-cost-probe
          path: artifacts/paired-ci-cost-probe.json
          if-no-files-found: error

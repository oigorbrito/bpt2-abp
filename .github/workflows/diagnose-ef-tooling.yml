name: Diagnose EF tooling fixture build
on:
  push:
    branches:
      - chore/dotnet-ef-10.0.12
    paths:
      - .github/workflows/diagnose-ef-tooling.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore tools
        run: dotnet tool restore
      - name: Build lifecycle fixture
        run: dotnet build tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release --verbosity normal
